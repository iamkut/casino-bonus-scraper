<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0" r="0.6">
      <stop offset="0%" stop-color="#2d1458" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2d1458" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="1" r="0.55">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd44d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd44d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd44d"/>
      <stop offset="50%" stop-color="#fff0a3"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#b91c3f"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <circle cx="600" cy="315" r="340" fill="url(#goldGlow)"/>

  <g opacity="0.55">
    <circle cx="120" cy="110" r="3" fill="#ffd44d"/>
    <circle cx="1080" cy="90" r="2" fill="#ffd44d"/>
    <circle cx="200" cy="520" r="2.5" fill="#ffd44d"/>
    <circle cx="1020" cy="500" r="3" fill="#ff3366"/>
    <circle cx="90" cy="320" r="2" fill="#7c3aed"/>
    <circle cx="1120" cy="280" r="2.5" fill="#7c3aed"/>
    <circle cx="300" cy="90" r="2" fill="#fff0a3"/>
    <circle cx="930" cy="560" r="2" fill="#fff0a3"/>
  </g>

  <g transform="translate(140 240)">
    <circle cx="0" cy="0" r="68" fill="url(#chip)" stroke="#ffd44d" stroke-width="4"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ffd44d" stroke-width="2" stroke-dasharray="6 10"/>
    <text x="0" y="12" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="36" font-weight="800" fill="#fff0a3">$</text>
  </g>

  <g transform="translate(1060 390)">
    <circle cx="0" cy="0" r="58" fill="#7c3aed" stroke="#ffd44d" stroke-width="4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ffd44d" stroke-width="2" stroke-dasharray="6 10"/>
    <text x="0" y="10" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="800" fill="#fff0a3">★</text>
  </g>

  <text x="600" y="285" text-anchor="middle"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="110" font-weight="800" letter-spacing="-3"
        fill="url(#goldText)">Casino Bonuses</text>

  <text x="600" y="355" text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif"
        font-size="30" font-weight="500" letter-spacing="2"
        fill="#a89bc9">LATEST WELCOME OFFERS · UPDATED DAILY</text>

  <g transform="translate(600 450)">
    <rect x="-180" y="-28" width="360" height="56" rx="28"
          fill="rgba(255, 212, 77, 0.08)"
          stroke="#ffd44d" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle"
          font-family="Segoe UI, system-ui, sans-serif"
          font-size="24" font-weight="700" letter-spacing="1"
          fill="#ffd44d">COMPARE · FILTER · CLAIM</text>
  </g>
</svg>
